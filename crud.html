<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 crud</title>

        <link rel="stylesheet" href="./style.css">
    <script src="./crud.js" defer></script>
</head>
<body>
    <h1>영화관리</h1>

    <a href="./index.html">다시 메인으로</a>
    
    <form id="movieform">
            <input id="title" type="text" placeholder="영화 제목" minlength="2" required>
        <input id="director" type="text" placeholder="감독" minlength="2" required>
        <input id="genre" type="text" placeholder="장르" minlength="1"  required>
        <input id="releaseYear" type="number" placeholder="개봉 연도" min=1900 max= 2026 required>
        <input id="rating" type="number" step="0.1" placeholder="평점"  min=0 max=10 required>

        <button id="submitButton" type="submit">등록</button>
        <button id="cancelButton" type="button" hidden>수정 취소</button>

    </form>

    <p id="message"></p>

<label for="searchInput">영화 검색</label>
<input
    id="searchInput"
    type="search"
    placeholder="영화 제목 검색"
>


    <table>
        <thead>
            <tr>
                                <th>ID</th>
                <th>제목</th>
                <th>감독</th>
                <th>장르</th>
                <th>개봉 연도</th>
                <th>평점</th>
                <th>관리</th>

            </tr>
        </thead>

        <tbody id="movieList">

        </tbody>
    </table>
</body>
</html>
